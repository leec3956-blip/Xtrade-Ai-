<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xtrade Ai Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
        }
        h1 { color: #00ffcc; margin-top: 20px; }
        p { color: #aaaaaa; font-size: 14px; }
        .btn-ctrader {
            background-color: #1fc1c4;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 30px;
            box-shadow: 0px 4px 15px rgba(31, 193, 196, 0.4);
            transition: 0.3s;
        }
        .btn-ctrader:hover { background-color: #1aa8ab; }
    </style>
</head>
<body>

    <h1>Papan Pemuka Xtrade Ai</h1>
    <p>Sila sambungkan akaun dagangan anda untuk bermula.</p>

    <!-- Butang Sambung ke cTrader -->
    <button class="btn-ctrader" onclick="mulaSambung()">Sambung ke cTrader</button>

    <script>
        function mulaSambung() {
            // Menggunakan Client ID rasmi dari portal cTrader anda
            const clientId = "41120"; 
            
            // Redirect URI lalai (pastikan sama seperti yang anda set di portal cTrader)
            const redirectUri = "http://localhost/"; 
            
            // Alamat URL rasmi log masuk cTrader OAuth2
            const authUrl = `https://ctrader.com{clientId}&redirect_uri=${redirectUri}&scope=trading,accounts&response_type=code`;
            
            window.location.href = authUrl;
        }
    </script>

</body>
</html>
