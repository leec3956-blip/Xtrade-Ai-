<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xtrade AI Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
      margin: 0;
    }
    h1 {
      color: #00ffcc;
      font-size: 20px;
      text-align: center;
      margin-bottom: 5px;
    }
    p.subtitle {
      color: #aaaaaa;
      font-size: 13px;
      text-align: center;
      margin-bottom: 25px;
    }
    .card {
      background-color: #1a1d26;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .dot {
      height: 10px;
      width: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-green { background-color: #00e676; }
    .dot-grey { background-color: #888888; }
    .card-text h4 {
      margin: 0;
      font-size: 14px;
      color: #ffffff;
    }
    .card-text p {
      margin: 2px 0 0 0;
      font-size: 11px;
      color: #aaaaaa;
    }
    .btn-action {
      background-color: #00e676;
      color: #000000;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Papan Pemuka Xtrade AI</h1>
  <p class="subtitle">Sila sambungkan akaun dagangan anda untuk bermula.</p>

  <!-- KOTAK MT5 -->
  <div class="card">
    <div class="card-info">
      <span class="dot dot-green"></span>
      <div class="card-text">
        <h4>MT5 Tersambung</h4>
        <p>MT5 Demo • ping 24ms</p>
      </div>
    </div>
  </div>

  <!-- KOTAK CTRADER -->
  <div class="card">
    <div class="card-info">
      <span class="dot dot-grey"></span>
      <div class="card-text">
        <h4>cTrader</h4>
        <p>Belum Tersambung</p>
      </div>
    </div>
    <button type="button" class="btn-action" onclick="mulaSambung()">Login cTrader</button>
  </div>

  <script>
    function mulaSambung() {
      const clientId = "41120";
      const redirectUri = "http://localhost/";
      const authUrl = `https://ctrader.com/oauth/v2/auth?client_id=${clientId}&redirect_uri=${encodeURIComponent(redirectUri)}&scope=trading,accounts&response_type=code`;
      window.location.href = authUrl;
    }
  </script>

</body>
</html>
