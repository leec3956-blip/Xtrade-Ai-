name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Cordova & Build APK
        run: |
          npm install -g cordova
          
          # Cipta projek dengan nama asal "Xtrade Ai"
          cordova create myApp com.xtrade.ai "Xtrade Ai"
          cd myApp
          rm -rf www/*
          
          # Salin fail aset asal (termasuk dashboard.html)
          cp -r ../app/src/main/assets/* www/ || true
          
          # Pastikan dashboard.html dijadikan index.html
          if [ -f www/dashboard.html ]; then
            cp www/dashboard.html www/index.html
          fi

          # Cari dan salin fail icon asal jika ada
          mkdir -p res/icon/android/
          ICON_FILE=$(find ../app/src/main/res/ -name "ic_launcher*.png" | head -n 1)
          if [ -n "$ICON_FILE" ]; then
            cp "$ICON_FILE" res/icon/android/icon.png
            sed -i 's|</widget>|<icon src="res/icon/android/icon.png" /></widget>|' config.xml
          fi

          cordova platform add android
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XtradeAi-app-debug
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
