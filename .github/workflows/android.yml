name: Build Android APK From Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Project Files
      run: |
        # Ekstrak fail zip
        unzip -o .github/workflows/XtradeAi_APK_BUILD_READY.zip -d ./
        
        # Cari di mana fail gradlew berada dan gerakkan semua fail dari folder itu ke folder utama
        GRADLEW_PATH=$(find . -name "gradlew" -not -path "./.*")
        if [ ! -z "$GRADLEW_PATH" ]; then
          FOLDER_PATH=$(dirname "$GRADLEW_PATH")
          echo "Menemui fail projek di dalam folder: $FOLDER_PATH"
          if [ "$FOLDER_PATH" != "." ]; then
            mv $FOLDER_PATH/* ./ 2>/dev/null || true
            mv $FOLDER_PATH/.* ./ 2>/dev/null || true
          fi
        else
          echo "Ralat: Fail gradlew tidak dijumpai di dalam fail zip!"
          exit 1
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XtradeAi-Aplikasi-APK
        path: |
          **/build/outputs/apk/debug/*.apk
