name: Build Android APK From Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Project Files
      run: |
        # Ekstrak fail zip terus ke direktori utama
        unzip -o .github/workflows/XtradeAi_APK_BUILD_READY.zip -d ./
        
        # Jika fail terekstrak ke dalam subfolder, gerakkan ia ke folder utama
        if [ -d "XtradeAi_APK_BUILD_READY" ]; then
          mv XtradeAi_APK_BUILD_READY/* ./ 2>/dev/null || true
          mv XtradeAi_APK_BUILD_READY/.* ./ 2>/dev/null || true
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Missing Gradle Wrapper
      run: |
        # Menjana fail gradlew yang hilang secara automatik menggunakan arahan gradle terbina
        gradle wrapper

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XtradeAi-Aplikasi-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
