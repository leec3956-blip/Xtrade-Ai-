name: Build Android APK From Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Project Files
      run: |
        # Sandarkan fail dashboard.html baharu anda ke folder sementara
        mkdir -p /tmp/backup
        if [ -f "app/src/main/assets/dashboard.html" ]; then
          cp app/src/main/assets/dashboard.html /tmp/backup/dashboard.html
        fi

        # Ekstrak fail zip utama
        unzip -o .github/workflows/XtradeAi_APK_BUILD_READY.zip -d ./
        
        # Pindahkan fail keluar jika tersimpan di dalam subfolder
        GRADLEW_PATH=$(find . -name "gradlew" -not -path "./.*")
        if [ ! -z "$GRADLEW_PATH" ]; then
          FOLDER_PATH=$(dirname "$GRADLEW_PATH")
          if [ "$FOLDER_PATH" != "." ]; then
            mv $FOLDER_PATH/* ./ 2>/dev/null || true
            mv $FOLDER_PATH/.* ./ 2>/dev/null || true
          fi
        fi

        # Masukkan semula fail dashboard.html cTrader anda yang disandarkan tadi
        mkdir -p app/src/main/assets
        if [ -f "/tmp/backup/dashboard.html" ]; then
          cp /tmp/backup/dashboard.html app/src/main/assets/dashboard.html
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XtradeAi-cTrader-APK
        path: |
          **/build/outputs/apk/debug/*.apk
